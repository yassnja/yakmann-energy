# Paths are relative to the base directory, not the repository root.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.0"
  NPM_FLAGS = "--include=dev"

# Astro fingerprints these files; a new build gets new asset URLs.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Astro generates real HTML pages and a 404.html; no SPA rewrite is needed.
